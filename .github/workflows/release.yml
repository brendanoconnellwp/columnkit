name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches plugin version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          HEADER_VERSION="$(grep -oP '^\s*\*\s*Version:\s*\K[0-9][^\s]*' columnkit.php | head -n1)"
          CONST_VERSION="$(grep -oP "define\(\s*'CK_VERSION',\s*'\K[^']+" columnkit.php | head -n1)"
          echo "tag=$VERSION header=$HEADER_VERSION const=$CONST_VERSION"
          if [ "$VERSION" != "$HEADER_VERSION" ] || [ "$VERSION" != "$CONST_VERSION" ]; then
            echo "::error::Tag v$VERSION does not match plugin version (header: $HEADER_VERSION, CK_VERSION: $CONST_VERSION). Bump columnkit.php before tagging."
            exit 1
          fi

      - name: Build plugin zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="$RUNNER_TEMP/columnkit"
          mkdir -p "$STAGE"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='coverage' \
            --exclude='.phpunit.cache' \
            --exclude='.phpunit.result.cache' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml.dist' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.editorconfig' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            ./ "$STAGE/"
          ( cd "$RUNNER_TEMP" && zip -rq "$GITHUB_WORKSPACE/columnkit-${VERSION}.zip" columnkit )
          echo "Built columnkit-${VERSION}.zip:"
          unzip -l "columnkit-${VERSION}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "columnkit-${VERSION}.zip" \
            --title "ColumnKit ${VERSION}" \
            --generate-notes
